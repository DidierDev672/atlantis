# ==============================================================================
# Nginx Host Reverse Proxy — aloja.dcsolutions.systems
# Ubicación en el servidor Linux: /etc/nginx/sites-available/aloja.dcsolutions.systems
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name aloja.dcsolutions.systems;

    # Tamaño máximo de body (ej. subida de imágenes de menú o documentos)
    client_max_body_size 15M;

    # Cabeceras de seguridad base
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Reverse Proxy hacia la API REST en Go (127.0.0.1:8081 -> contenedor :8080)
    location /api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Reenvío explícito de cabeceras de autenticación, multi-sede e idempotencia
        proxy_set_header Authorization $http_authorization;
        proxy_set_header auth-token $http_auth_token;
        proxy_set_header X-Headquarter-ID $http_x_headquarter_id;
        proxy_set_header Idempotency-Key $http_idempotency_key;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 2. Reverse Proxy hacia el Frontend SPA (127.0.0.1:3001 -> contenedor :80)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
